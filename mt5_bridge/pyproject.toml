[project]
name = "mt5-bridge"
version = "0.1.0"
description = "FastAPI bridge over MetaTrader5 Python package (read-only Phase 1+2)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    # MetaTrader5 は Windows でのみインストール (Linux/Mac では skip)
    "MetaTrader5>=5.0.45; sys_platform == 'win32'",
]

[tool.uv]
package = false
